# Render Blueprint — DZ LEGENDS PIZZA (static menu)
#
# IMPORTANT — this is the fix for the black screen on Render:
# the site must be published from ./dist (the Vite build output), NOT from the
# repository root. The root index.html only contains
#   <script type="module" src="/src/main.tsx"></script>
# which a static host cannot execute, so React never mounts and the page stays
# black (color-scheme: dark).
#
# Use: Render > New > Blueprint > connect the GitHub repo > select render.yaml
# If you keep the existing manually-created Static Site instead, set the same
# values in its Settings > Build & Deploy and redeploy.

services:
  - type: web
    name: dz-legends-pizza
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Vite 7 requires Node 20.19+ / 22.12+. Pin the version on Render so the
      # production build cannot silently fall back to an older Node runtime.
      - key: NODE_VERSION
        value: 22
